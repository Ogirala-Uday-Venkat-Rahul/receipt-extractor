<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Receipt Extractor</title>
  <style>
    :root { --bg:#0f1116; --panel:#171a21; --line:#272b35; --ink:#e6e8ee; --mut:#9aa3b2; --acc:#5b8cff; --ok:#3fb950; --bad:#f85149; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
           background:var(--bg); color:var(--ink); }
    .wrap { max-width:900px; margin:0 auto; padding:32px 20px 64px; }
    h1 { font-size:22px; margin:0 0 4px; }
    p.sub { color:var(--mut); margin:0 0 24px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media (max-width:760px){ .grid{ grid-template-columns:1fr; } }
    label { font-size:13px; color:var(--mut); display:block; margin:0 0 6px; }
    textarea { width:100%; height:340px; resize:vertical; background:var(--panel); color:var(--ink);
               border:1px solid var(--line); border-radius:10px; padding:12px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; }
    .out { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px;
           height:340px; overflow:auto; white-space:pre-wrap; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; }
    .row { display:flex; align-items:center; gap:12px; margin:16px 0; flex-wrap:wrap; }
    button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:14px; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .chip { background:var(--panel); border:1px solid var(--line); color:var(--mut); border-radius:999px;
            padding:6px 12px; font-size:12px; cursor:pointer; }
    .chip:hover { color:var(--ink); border-color:var(--acc); }
    .badge { font-size:12px; padding:3px 10px; border-radius:999px; font-weight:600; }
    .badge.ok { background:rgba(63,185,80,.15); color:var(--ok); }
    .badge.bad { background:rgba(248,81,73,.15); color:var(--bad); }
    .muted { color:var(--mut); font-size:13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Receipt Extractor</h1>
    <p class="sub">Fine-tuned Qwen2.5-7B turns messy receipt text into structured JSON.</p>

    <div class="row">
      <span class="muted">Try a sample:</span>
      <span class="chip" data-sample="cafe">Cafe receipt</span>
      <span class="chip" data-sample="hardware">Hardware store</span>
    </div>

    <div class="grid">
      <div>
        <label for="in">Receipt text</label>
        <textarea id="in" placeholder="Paste a receipt here..."></textarea>
      </div>
      <div>
        <label>Extracted JSON <span id="badge"></span></label>
        <div id="out" class="out muted">Output will appear here.</div>
      </div>
    </div>

    <div class="row">
      <button id="go">Extract</button>
      <span id="status" class="muted"></span>
    </div>
  </div>

  <script>
    const SAMPLES = {
      cafe: `CAFE VERONA
220 Hill St
Date: 09 January 2025
Receipt #: 28595
-----------------------------
2 x Cappuccino          $9.00
Sourdough Loaf x1       $5.50
Greek Salad          1 @ $8.00
-----------------------------
Subtotal            $22.50
Tax                 $1.80
AMOUNT DUE          $24.30
Thanks for shopping with us`,
      hardware: `PETE'S HARDWARE
88 Elm Avenue
Tel: (555) 210-2629
Date: Mar 04, 2025
Cashier: Jordan
-------------------------
Light Bulb 60W    3 @ $3.15
1 x USB-C Cable       $12.00
------------------------
BALANCE DUE         $21.45`
    };

    const $ = (id) => document.getElementById(id);
    document.querySelectorAll('.chip').forEach(c =>
      c.addEventListener('click', () => { $('in').value = SAMPLES[c.dataset.sample]; }));

    async function run() {
      const text = $('in').value.trim();
      if (!text) return;
      $('go').disabled = true;
      $('status').textContent = 'Extracting...';
      $('badge').innerHTML = '';
      $('out').className = 'out muted';
      $('out').textContent = 'Working...';
      try {
        const res = await fetch('/extract', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ text })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'request failed');
        $('out').className = 'out';
        $('out').textContent = data.valid
          ? JSON.stringify(data.receipt, null, 2)
          : data.raw;
        $('badge').innerHTML = data.valid
          ? '<span class="badge ok">valid JSON</span>'
          : '<span class="badge bad">invalid JSON</span>';
        $('status').textContent = '';
      } catch (e) {
        $('out').className = 'out muted';
        $('out').textContent = String(e.message || e);
        $('status').textContent = '';
      } finally {
        $('go').disabled = false;
      }
    }

    $('go').addEventListener('click', run);
    $('in').addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') run();
    });
  </script>
</body>
</html>
